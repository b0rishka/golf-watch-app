name: Update course list

on:
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC daily
  workflow_dispatch:      # allow manual trigger from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch courses from Overpass
        run: python3 backend/fetch_courses.py

      - name: Commit updated course list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/courses.json
          git diff --staged --quiet && echo "No changes" || \
            (git commit -m "Update course list ($(date -u +%Y-%m-%d))" && git push)
